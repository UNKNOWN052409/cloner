<!doctype html>
<!-- Page 5 — Clone Blueprint: renders artifacts/<jobId>/blueprint.json (the
     fidelity contract written by src/reconstruction/blueprint.js) and posts the
     user's scope edits. Self-contained: owns its tokens + styles inline so the
     shell (index.html/app.js) never needs to be touched for this page to work. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clone Blueprint</title>
<style>
:root{
  --bg:#0b0f14; --panel:#121821; --panel2:#0e141c; --line:#223041;
  --ink:#e6edf3; --muted:#8b98a9; --accent:#4f8cff; --ok:#3fb96f; --warn:#e0a63a; --err:#e05252;
  --radius:10px; --font:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--panel2)}
header h1{font-size:18px;margin:0}
header .src{color:var(--muted);font-family:var(--mono);font-size:12px}
main{max-width:1100px;margin:0 auto;padding:20px}
.grid{display:grid;gap:16px}
.grid.cols2{grid-template-columns:1fr 1fr}
@media (max-width:820px){.grid.cols2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-family:var(--mono);border:1px solid var(--line)}
.badge.observed{color:var(--ok);border-color:var(--ok)}
.badge.inferred{color:var(--warn);border-color:var(--warn)}
.badge.unverified{color:var(--muted);border-color:var(--line)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.err{color:var(--err);border-color:var(--err)}
ul.list{margin:0;padding-left:18px}
ul.list li{margin:2px 0}
code,.mono{font-family:var(--mono);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:2px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);font-size:11px}
textarea{width:100%;min-height:64px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--mono);font-size:12px;resize:vertical}
label{display:block;color:var(--muted);font-size:12px;margin:10px 0 4px}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice{border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px}
.notice.ok{background:rgba(63,185,111,.12);border:1px solid var(--ok)}
.notice.err{background:rgba(224,82,82,.12);border:1px solid var(--err)}
.page{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel2)}
.page .pid{font-family:var(--mono);font-weight:700}
.page .url{color:var(--muted);font-family:var(--mono);font-size:11px;word-break:break-all}
.regions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kv{color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-style:italic}
.state{padding:40px;text-align:center;color:var(--muted)}
.state.err{color:var(--err)}
</style>
</head>
<body>
<header>
  <h1>Clone Blueprint</h1>
  <span class="src" id="src-line">loading…</span>
  <nav style="margin-left:auto;font-size:12px">
    <a href="blueprint.html">5</a> ·
    <a href="reconstruction.html">6</a> ·
    <a href="comparison.html">7</a> ·
    <a href="final.html">8</a>
  </nav>
</header>
<main id="main" class="state">loading blueprint…</main>
<script src="./blueprint.js" type="module"></script>
</body>
</html>

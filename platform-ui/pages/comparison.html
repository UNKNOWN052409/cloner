<!doctype html>
<!-- Page 7 — Comparison & QA: original vs clone screenshots (artifacts
     pages/page-001/screenshot-viewport.png and _reference/clone-verify.png via
     GET /api/jobs/:jobId/artifacts/*), verification.json stage results
     (functional / optimization-completeness / visual), reports/flow-matrix.json
     case list + bugs, and a defect classification summary. Self-contained. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Comparison &amp; QA</title>
<style>
:root{
  --bg:#0b0f14; --panel:#121821; --panel2:#0e141c; --line:#223041;
  --ink:#e6edf3; --muted:#8b98a9; --accent:#4f8cff; --ok:#3fb96f; --warn:#e0a63a; --err:#e05252;
  --radius:10px; --font:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
a{color:var(--accent);text-decoration:none}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel2)}
header h1{font-size:18px;margin:0}
header .src{color:var(--muted);font-family:var(--mono);font-size:12px}
main{max-width:1200px;margin:0 auto;padding:16px 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:860px){.compare{grid-template-columns:1fr}}
.shot{border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:8px;min-height:80px}
.shot .cap{font-size:11px;font-family:var(--mono);color:var(--muted);margin-bottom:6px}
.shot img{width:100%;height:auto;display:block;border-radius:4px;background:#000}
.shot .missing{color:var(--err);font-size:12px;padding:24px 6px;text-align:center}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-family:var(--mono);border:1px solid var(--line)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.err{color:var(--err);border-color:var(--err)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.06em}
td.mono{font-family:var(--mono);font-size:11px}
.check{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:12px}
.check .mark{font-family:var(--mono);font-weight:700}
.check .mark.ok{color:var(--ok)} .check .mark.err{color:var(--err)}
.check .detail{color:var(--muted)}
.stage{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--panel2)}
.stage h3{margin:0 0 6px;font-size:13px;display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{padding:2px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);font-size:11px}
.kv{color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-style:italic}
.state{padding:40px;text-align:center;color:var(--muted)}
.state.err{color:var(--err)}
summary{cursor:pointer;color:var(--accent);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Comparison &amp; QA</h1>
  <span class="src" id="src-line">loading…</span>
  <nav style="margin-left:auto;font-size:12px">
    <a href="blueprint.html">5</a> ·
    <a href="reconstruction.html">6</a> ·
    <a href="comparison.html">7</a> ·
    <a href="final.html">8</a>
  </nav>
</header>
<main id="main" class="state">loading comparison evidence…</main>
<script src="./comparison.js" type="module"></script>
</body>
</html>

<!doctype html>
<!-- Page 8 — Final Project: live clone preview (GET /preview/:id), export.zip
     download (GET /api/export/:id/download), GitHub publish (POST
     /api/github/publish/:taskId), build report + known limitations
     (verification.json + reconstruction-report.json), version history wired to
     /api/versions (renders the honest 404 state while unmounted).
     Tokens come from the shell (../design-tokens.css); styles here are
     page-local components on those semantic tokens. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script type="module">
/* shell tokens (../design-tokens.css): fetched + injected instead of a plain
 * <link> so an absent sheet degrades silently — a 404'd <link> logs a strict-
 * MIME "Refused to apply style" console error on hosts that don't serve it. */
try {
  const css = await fetch("../design-tokens.css").then((r) => (r.ok ? r.text() : null));
  if (css) { const el = document.createElement("style"); el.textContent = css; document.head.prepend(el); }
} catch { /* token sheet optional — components fall back to UA defaults */ }
</script>
<title>Final Project</title>
<style>
/* page components on shell tokens — no raw palette here (see design-tokens.css) */
*{box-sizing:border-box}
body{margin:0;background:var(--bg-canvas);color:var(--fg-default);font:var(--fs-body)/1.5 var(--font-body)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(var(--border-default) 1px,transparent 1px);background-size:24px 24px;opacity:.4}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-bright);text-decoration:underline}
header{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:baseline;padding:var(--sp-3) var(--sp-5);border-bottom:1px solid var(--border-default);background:var(--bg-page)}
header h1{font-size:var(--fs-h1);font-weight:300;line-height:1.15;margin:0}
header .src{color:var(--fg-muted);font-family:var(--font-data);font-size:var(--fs-small)}
header nav a{font-family:var(--font-data);font-size:var(--fs-small)}
main{max-width:var(--max-w);margin:0 auto;padding:var(--sp-4) var(--sp-5)}
.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:var(--sp-4)}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--bg-page);border:1px solid var(--border-default);border-radius:var(--radius);padding:var(--sp-4);margin-bottom:var(--sp-4)}
.card h2{font-size:var(--fs-small);font-weight:400;color:var(--fg-muted);margin:0 0 var(--sp-3)}
.frame-wrap{position:relative;height:480px;border:1px solid var(--border-default);border-radius:var(--radius);background:var(--bg-canvas);overflow:hidden}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg-canvas)}
.badge{display:inline-block;padding:1px var(--sp-2);border-radius:var(--radius);font-size:var(--fs-caption);font-family:var(--font-data);border:1px solid var(--border-default);color:var(--fg-muted)}
.badge.ok{color:var(--status-ok);border-color:var(--status-ok);background:var(--bg-ok)}
.badge.err{color:var(--status-error);border-color:var(--status-error-strong);background:var(--bg-error)}
.badge.warn{color:var(--status-pending);border-color:var(--status-pending);background:var(--bg-pending)}
button{background:var(--accent-quiet);color:var(--accent-bright);border:1px solid var(--accent);border-radius:var(--radius);padding:var(--sp-2) var(--sp-4);font:inherit;font-size:var(--fs-small);font-weight:600;cursor:pointer}
button:hover{background:var(--bg-accent-well)}
button.ghost{background:transparent;color:var(--fg-muted);border:1px solid var(--border-default)}
button.ghost:hover{background:var(--bg-hover);color:var(--fg-default)}
button:disabled{color:var(--fg-faint);cursor:default}
input,select{background:var(--bg-input);color:var(--fg-default);border:1px solid var(--border-strong);border-radius:var(--radius);padding:var(--sp-2) var(--sp-3);font:inherit;font-size:var(--fs-small);width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent)}
label{display:block;color:var(--fg-muted);font-size:var(--fs-small);margin:var(--sp-2) 0 var(--sp-1)}
.notice{border-radius:var(--radius);padding:var(--sp-3);font-size:var(--fs-small);margin-top:var(--sp-3)}
.notice.ok{background:var(--bg-ok);border:1px solid var(--status-ok);color:var(--status-ok)}
.notice.err{background:var(--bg-error);border:1px solid var(--status-error-strong);color:var(--status-error)}
.notice.warn{background:var(--bg-pending);border:1px solid var(--status-pending);color:var(--status-pending)}
ul.list{margin:0;padding-left:var(--sp-5)}
ul.list li{margin:3px 0}
.kv{color:var(--fg-muted);font-size:var(--fs-small)}
.mono{font-family:var(--font-data);font-size:var(--fs-small)}
.empty{color:var(--fg-muted);font-style:italic}
.stage{display:flex;gap:var(--sp-2);align-items:baseline;padding:2px 0;font-size:var(--fs-small)}
.check{display:flex;gap:var(--sp-2);align-items:baseline;padding:2px 0;font-size:var(--fs-small)}
.check .mark{font-family:var(--font-data);font-weight:700}
.check .mark.ok{color:var(--status-ok)} .check .mark.err{color:var(--status-error)}
.check .detail{color:var(--fg-muted)}
.state{padding:var(--sp-7);text-align:center;color:var(--fg-muted);border:1px dashed var(--border-strong);border-radius:var(--radius);background:var(--bg-page)}
.state.err{color:var(--status-error);border-color:var(--status-error-strong)}
.actions{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<header>
  <h1>Final Project</h1>
  <span class="src" id="src-line">loading…</span>
  <nav style="margin-left:auto;font-size:var(--fs-small)">
    <a href="blueprint.html">5</a> ·
    <a href="reconstruction.html">6</a> ·
    <a href="comparison.html">7</a> ·
    <a href="final.html">8</a>
  </nav>
</header>
<main id="main" class="state">loading final project…</main>
<script src="./final.js" type="module"></script>
</body>
</html>
